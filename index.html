<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>watchParty - Distraction-Free Watch Together</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        @keyframes floatUp {
            0% { transform: translateY(0px) scale(0.6); opacity: 0; }
            20% { opacity: 1; transform: translateY(-50px) scale(1.2); }
            100% { transform: translateY(-400px) scale(1); opacity: 0; }
        }
        .floating-emoji {
            position: absolute;
            bottom: 60px;
            animation: floatUp 3.5s ease-out forwards;
            pointer-events: none;
            font-size: 2rem;
            z-index: 50;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col select-none">

    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800/80 px-4 py-3 flex items-center justify-between z-30">
        <div class="flex flex-col">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🍿</span>
                <h1 class="font-bold text-lg text-indigo-400 tracking-tight">watchParty</h1>
            </div>
            <span class="text-[10px] text-slate-400 ml-8 -mt-1 font-medium">by Ashiqur Rahman Alif</span>
        </div>
        <div class="flex items-center gap-2">
            <!-- Connected Users Pill with Popup Toggle -->
            <div id="users-pill" class="hidden relative">
                <button onclick="toggleUserPopup()" class="flex items-center gap-1.5 text-xs bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 px-3 py-1.5 rounded-full transition shadow-sm">
                    <span>🟢</span>
                    <span class="font-semibold" id="peer-count">1</span> Users
                </button>
                <!-- Popup Users List -->
                <div id="users-popup" class="hidden absolute right-0 mt-2 w-48 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl p-3 z-50">
                    <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2 border-b border-slate-800 pb-1">In Room</div>
                    <div id="participants-list" class="flex flex-col gap-1.5 max-h-40 overflow-y-auto">
                        <!-- Dynamic items -->
                    </div>
                </div>
            </div>

            <span id="connection-status" class="text-[10px] bg-amber-950 text-amber-300 border border-amber-800 px-2.5 py-1 rounded-full">Connecting...</span>
            <div id="room-badge" class="hidden text-xs bg-indigo-950 text-indigo-300 border border-indigo-800 px-2.5 py-1 rounded-full">
                Room: <span id="current-room-id" class="font-mono font-semibold"></span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 flex flex-col justify-center items-center">

        <!-- Lobby Screen -->
        <div id="lobby-card" class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl flex flex-col justify-center space-y-6 max-w-md w-full">
            <div class="text-center space-y-2">
                <h2 class="text-2xl font-bold tracking-tight">Immersive Watch Party</h2>
                <p class="text-sm text-slate-400">Zero database, zero servers. P2P synced media with live emoji vibes.</p>
            </div>
            
            <div class="space-y-4 w-full">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Your Display Name</label>
                    <input type="text" id="username-input" placeholder="e.g. StarLord" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <button onclick="createRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/20">
                    Create New Room
                </button>
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-800"></div>
                    <span class="flex-shrink mx-4 text-xs text-slate-500 uppercase">Or join existing</span>
                    <div class="flex-grow border-t border-slate-800"></div>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="join-room-id" placeholder="Room Code" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm uppercase focus:outline-none focus:border-indigo-500 font-mono">
                    <button onclick="joinRoom()" class="bg-slate-800 hover:bg-slate-700 text-white px-5 py-2.5 rounded-xl font-medium text-sm transition">Join</button>
                </div>
            </div>
        </div>

        <!-- Active Watchroom -->
        <div id="room-view" class="hidden flex flex-col space-y-4 w-full">
            
            <!-- Video Source Input Bar -->
            <div class="flex gap-2 bg-slate-900 p-3 rounded-xl border border-slate-800 shadow-lg">
                <input type="text" id="media-url-input" placeholder="Paste YouTube link or Direct .mp4/.webm URL..." class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500">
                <button onclick="changeMediaSource()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-medium transition shrink-0">Load Media</button>
            </div>

            <!-- Video Player & Floating Emojis Container -->
            <div id="player-wrapper" class="relative bg-black rounded-2xl overflow-hidden aspect-video shadow-2xl border border-slate-800 flex items-center justify-center">
                <video id="shared-video" controls class="w-full h-full object-contain hidden"></video>
                <div id="youtube-player" class="w-full h-full hidden"></div>
                
                <!-- Floating Emojis Overlay Target -->
                <div id="emoji-overlay" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

                <div id="video-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 space-y-2 bg-slate-900/90 z-10">
                    <span class="text-5xl">🎬</span>
                    <p class="text-sm font-medium">Paste a video link above to begin watching together!</p>
                </div>
            </div>

            <!-- Bottom Controls & Smart Emoji Bar -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-slate-900 p-3.5 rounded-xl border border-slate-800">
                
                <!-- Emoji Reaction Deck -->
                <div class="flex items-center gap-1.5 bg-slate-950 p-1.5 rounded-xl border border-slate-800/80">
                    <button onclick="sendEmoji('🍿')" class="hover:bg-slate-800 p-2 rounded-lg text-lg transition transform hover:scale-125" title="Party">🍿</button>
                    <button onclick="sendEmoji('🔥')" class="hover:bg-slate-800 p-2 rounded-lg text-lg transition transform hover:scale-125" title="Fun / Hype">🔥</button>
                    <button onclick="sendEmoji('❤️')" class="hover:bg-slate-800 p-2 rounded-lg text-lg transition transform hover:scale-125" title="Love">❤️</button>
                    <button onclick="sendEmoji('😢')" class="hover:bg-slate-800 p-2 rounded-lg text-lg transition transform hover:scale-125" title="Sad">😢</button>
                    <button onclick="sendEmoji('👻')" class="hover:bg-slate-800 p-2 rounded-lg text-lg transition transform hover:scale-125" title="Horror">👻</button>
                    <button onclick="sendEmoji('🚀')" class="hover:bg-slate-800 p-2 rounded-lg text-lg transition transform hover:scale-125" title="Epic">🚀</button>
                    <button onclick="sendEmoji('👏')" class="hover:bg-slate-800 p-2 rounded-lg text-lg transition transform hover:scale-125" title="Clap">👏</button>
                </div>

                <!-- Room Invite Link Sharing -->
                <div class="flex items-center gap-2 text-xs w-full sm:w-auto justify-end">
                    <span class="text-slate-400 hidden md:inline">Share:</span>
                    <span id="share-link" class="text-indigo-400 font-mono bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 truncate max-w-[200px]"></span>
                    <button onclick="copyShareLink()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg font-medium transition shrink-0">Copy Link</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Client Script Logic -->
    <script>
        let peer = null;
        let connections = [];
        let isHost = false;
        let myId = '';
        let myUsername = 'Viewer_' + Math.floor(Math.random() * 1000);
        let participants = [];
        
        const videoElement = document.getElementById('shared-video');
        let ytPlayer = null;
        let currentMode = null;
        let syncLock = false;

        window.addEventListener('load', () => {
            const savedName = localStorage.getItem('syncparty_username');
            if (savedName) document.getElementById('username-input').value = savedName;
            const hash = window.location.hash.substring(1);
            if (hash) document.getElementById('join-room-id').value = hash;

            // Close popup when clicking outside
            window.addEventListener('click', (e) => {
                const pill = document.getElementById('users-pill');
                const popup = document.getElementById('users-popup');
                if (pill && !pill.contains(e.target)) {
                    popup.classList.add('hidden');
                }
            });
        });

        function toggleUserPopup() {
            const popup = document.getElementById('users-popup');
            popup.classList.toggle('hidden');
        }

        function onYouTubeIframeAPIReady() {}

        function extractYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function initPeer(customId = undefined) {
            return new Promise((resolve, reject) => {
                const nameVal = document.getElementById('username-input').value.trim();
                if (nameVal) {
                    myUsername = nameVal;
                    localStorage.setItem('syncparty_username', myUsername);
                }

                peer = new Peer(customId, {
                    config: {
                        'iceServers': [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' }
                        ]
                    },
                    debug: 1
                });

                peer.on('open', (id) => {
                    myId = id;
                    updateConnectionBadge('Connected', 'bg-emerald-950 text-emerald-300 border-emerald-800');
                    resolve(id);
                });

                peer.on('error', (err) => {
                    alert('Connection Error: ' + err.type);
                    updateConnectionBadge('Error', 'bg-rose-950 text-rose-300 border-rose-800');
                    reject(err);
                });

                peer.on('connection', (conn) => {
                    setupConnection(conn);
                });
            });
        }

        function updateConnectionBadge(text, cssClass) {
            const badge = document.getElementById('connection-status');
            badge.className = `text-[10px] border px-2.5 py-1 rounded-full ${cssClass}`;
            badge.innerText = text;
        }

        async function createRoom() {
            try {
                const roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
                await initPeer(roomId);
                isHost = true;
                participants = [{ id: myId, name: myUsername, host: true }];
                enterRoomUI(roomId);
            } catch (e) { console.error(e); }
        }

        async function joinRoom() {
            const roomId = document.getElementById('join-room-id').value.trim().toUpperCase();
            if (!roomId) return alert('Please enter a valid room ID.');
            try {
                await initPeer();
                isHost = false;
                participants = [{ id: myId, name: myUsername, host: false }];
                const conn = peer.connect(roomId, { metadata: { username: myUsername } });
                setupConnection(conn);
                enterRoomUI(roomId);
            } catch (e) { console.error(e); }
        }

        function enterRoomUI(roomId) {
            document.getElementById('lobby-card').classList.add('hidden');
            document.getElementById('room-view').classList.remove('hidden');
            document.getElementById('room-badge').classList.remove('hidden');
            document.getElementById('users-pill').classList.remove('hidden');
            document.getElementById('current-room-id').innerText = roomId;
            
            const shareUrl = window.location.origin + window.location.pathname + '#' + roomId;
            document.getElementById('share-link').innerText = shareUrl;
            window.location.hash = roomId;
            updateParticipantsUI();
        }

        function setupConnection(conn) {
            connections.push(conn);

            conn.on('open', () => {
                if (!isHost) {
                    conn.send({ type: 'JOIN', username: myUsername });
                }
            });

            conn.on('data', (data) => {
                handleIncomingData(data, conn);
            });

            conn.on('close', () => {
                connections = connections.filter(c => c !== conn);
                participants = participants.filter(p => p.id !== conn.peer);
                updateParticipantsUI();
                if (isHost) broadcast({ type: 'PARTICIPANTS', list: participants });
            });
        }

        function broadcast(data, excludeConn = null) {
            if (isHost) {
                connections.forEach(conn => { if (conn !== excludeConn) conn.send(data); });
            }
        }

        function handleIncomingData(data, conn) {
            switch (data.type) {
                case 'JOIN':
                    if (isHost) {
                        if (!participants.some(p => p.id === conn.peer)) {
                            participants.push({ id: conn.peer, name: data.username, host: false });
                        }
                        broadcast({ type: 'PARTICIPANTS', list: participants });
                        updateParticipantsUI();
                    }
                    break;
                case 'PARTICIPANTS':
                    participants = data.list;
                    updateParticipantsUI();
                    break;
                case 'EMOJI':
                    spawnFloatingEmoji(data.emoji);
                    if (isHost) broadcast(data, conn);
                    break;
                case 'MEDIA_CHANGE':
                    loadMediaSource(data.url, false);
                    if (isHost) broadcast(data, conn);
                    break;
                case 'VIDEO_ACTION':
                    syncLock = true;
                    executeVideoAction(data.action, data.time);
                    setTimeout(() => { syncLock = false; }, 400);
                    if (isHost) broadcast(data, conn);
                    break;
            }
        }

        function updateParticipantsUI() {
            document.getElementById('peer-count').innerText = participants.length;
            const container = document.getElementById('participants-list');
            container.innerHTML = participants.map(p => `
                <div class="flex items-center justify-between text-xs text-slate-300 bg-slate-950 px-2 py-1.5 rounded-lg border border-slate-800">
                    <span class="truncate">🟢 ${escapeHtml(p.name)}</span>
                    <span>${p.host ? '👑' : ''}</span>
                </div>
            `).join('');
        }

        // --- Emoji Reactions Flow ---
        function sendEmoji(emoji) {
            spawnFloatingEmoji(emoji);
            const payload = { type: 'EMOJI', emoji: emoji };
            if (isHost) {
                broadcast(payload);
            } else if (connections.length > 0) {
                connections[0].send(payload);
            }
        }

        function spawnFloatingEmoji(emoji) {
            const overlay = document.getElementById('emoji-overlay');
            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.innerText = emoji;
            const randomX = Math.random() * 80 + 10; 
            el.style.left = `${randomX}%`;
            overlay.appendChild(el);
            setTimeout(() => { el.remove(); }, 3500);
        }

        // --- Media Handling & Sync ---
        function changeMediaSource() {
            const url = document.getElementById('media-url-input').value.trim();
            if (!url) return;
            loadMediaSource(url, true);
        }

        function loadMediaSource(url, sendToOthers) {
            document.getElementById('video-placeholder').classList.add('hidden');
            const ytId = extractYouTubeId(url);

            if (ytId) {
                currentMode = 'youtube';
                videoElement.classList.add('hidden');
                videoElement.pause();
                document.getElementById('youtube-player').classList.remove('hidden');

                if (!ytPlayer) {
                    ytPlayer = new YT.Player('youtube-player', {
                        height: '100%',
                        width: '100%',
                        videoId: ytId,
                        playerVars: { 'autoplay': 1, 'controls': 1 },
                        events: { 'onStateChange': onYTStateChange }
                    });
                } else {
                    ytPlayer.loadVideoById(ytId);
                }
            } else {
                currentMode = 'html5';
                document.getElementById('youtube-player').classList.add('hidden');
                if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
                videoElement.classList.remove('hidden');
                videoElement.src = url;
                videoElement.load();
            }

            if (sendToOthers) {
                const payload = { type: 'MEDIA_CHANGE', url: url };
                if (isHost) broadcast(payload);
                else if (connections.length > 0) connections[0].send(payload);
            }
        }

        videoElement.addEventListener('play', () => {
            if (syncLock || currentMode !== 'html5') return;
            sendVideoAction('play', videoElement.currentTime);
        });
        videoElement.addEventListener('pause', () => {
            if (syncLock || currentMode !== 'html5') return;
            sendVideoAction('pause', videoElement.currentTime);
        });
        videoElement.addEventListener('seeked', () => {
            if (syncLock || currentMode !== 'html5') return;
            sendVideoAction('seek', videoElement.currentTime);
        });

        function onYTStateChange(event) {
            if (syncLock || currentMode !== 'youtube') return;
            const time = ytPlayer.getCurrentTime();
            if (event.data === YT.PlayerState.PLAYING) sendVideoAction('play', time);
            else if (event.data === YT.PlayerState.PAUSED) sendVideoAction('pause', time);
        }

        function executeVideoAction(action, time) {
            if (currentMode === 'html5') {
                if (action === 'play') {
                    videoElement.currentTime = time;
                    videoElement.play().catch(() => {});
                } else if (action === 'pause') {
                    videoElement.currentTime = time;
                    videoElement.pause();
                } else if (action === 'seek') {
                    videoElement.currentTime = time;
                }
            } else if (currentMode === 'youtube' && ytPlayer && ytPlayer.seekTo) {
                const diff = Math.abs(ytPlayer.getCurrentTime() - time);
                if (diff > 1.5) ytPlayer.seekTo(time, true);
                if (action === 'play') ytPlayer.playVideo();
                else if (action === 'pause') ytPlayer.pauseVideo();
            }
        }

        function sendVideoAction(action, time) {
            const payload = { type: 'VIDEO_ACTION', action: action, time: time };
            if (isHost) broadcast(payload);
            else if (connections.length > 0) connections[0].send(payload);
        }

        function copyShareLink() {
            navigator.clipboard.writeText(document.getElementById('share-link').innerText);
            alert('Room link copied to clipboard!');
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
