<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WatchParty - Serverless Watch Together</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        
        @keyframes floatUp {
            0% { transform: translateY(0px) scale(0.5); opacity: 0; }
            20% { opacity: 0.9; transform: translateY(-30px) scale(1); }
            100% { transform: translateY(-220px) scale(0.8); opacity: 0; }
        }
        .floating-emoji {
            position: absolute;
            bottom: 10px;
            animation: floatUp 2.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            pointer-events: none;
            font-size: 1.5rem;
            z-index: 40;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden flex flex-col select-none">

    <!-- Header -->
    <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800/80 px-4 py-2.5 flex items-center justify-between shrink-0 z-30">
        <div class="flex flex-col">
            <div class="flex items-center space-x-2">
                <span class="text-xl">🍿</span>
                <h1 class="font-bold text-lg text-indigo-400 tracking-tight">WatchParty</h1>
            </div>
            <span class="text-[9px] text-slate-400 ml-7 -mt-1 font-medium tracking-wide">by Ashiqur Rahman Alif</span>
        </div>
        <div class="flex items-center gap-2">
            <!-- Connection Status Dot -->
            <div id="connection-status-dot" class="w-2.5 h-2.5 rounded-full bg-rose-500" title="Offline"></div>
            
            <!-- Room Badge & Top Copy Button -->
            <div id="room-badge" class="hidden flex items-center gap-1.5 text-xs bg-indigo-950/80 text-indigo-300 border border-indigo-800/80 pl-2.5 pr-1 py-0.5 rounded-full">
                <span class="font-mono font-bold text-[11px]" id="current-room-id"></span>
                <button onclick="copyHeaderRoomLink()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs p-1 rounded-full transition" title="Copy Room Link">📋</button>
            </div>
        </div>
    </header>

    <!-- Main Container (Native App Screen Layout) -->
    <main class="flex-1 w-full max-w-4xl mx-auto p-2 sm:p-4 flex flex-col justify-center items-center overflow-hidden">

        <!-- Lobby Screen -->
        <div id="lobby-card" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col justify-center space-y-5 max-w-md w-full">
            <div class="text-center space-y-1">
                <h2 class="text-xl font-bold tracking-tight">WatchParty Room</h2>
                <p class="text-xs text-slate-400">P2P media sync for YouTube, Facebook, Vimeo & direct links.</p>
            </div>
            
            <div class="space-y-3.5 w-full">
                <div>
                    <label class="block text-[11px] font-medium text-slate-400 mb-1">Display Name</label>
                    <input type="text" id="username-input" placeholder="e.g. Viewer" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Custom Key & Password Box -->
                <div class="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800/80 space-y-2.5">
                    <span class="block text-[10px] font-semibold text-indigo-400 uppercase tracking-wider">Host Custom Room</span>
                    <input type="text" id="custom-room-input" placeholder="Room Code (e.g. MYLOVE)" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs uppercase font-mono focus:outline-none focus:border-indigo-500">
                    <input type="password" id="create-password-input" placeholder="Optional Password" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-indigo-500">
                    <button onclick="createRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-1.5 rounded-lg text-xs transition shadow-lg shadow-indigo-600/20">
                        Create Party
                    </button>
                </div>

                <div class="relative flex py-0.5 items-center">
                    <div class="flex-grow border-t border-slate-800"></div>
                    <span class="flex-shrink mx-3 text-[9px] text-slate-500 uppercase">Or Join</span>
                    <div class="flex-grow border-t border-slate-800"></div>
                </div>

                <div class="flex gap-2">
                    <input type="text" id="join-room-id" placeholder="Code (e.g. MYLOVE)" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs uppercase focus:outline-none focus:border-indigo-500 font-mono">
                    <button onclick="joinRoom()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl font-medium text-xs transition">Join</button>
                </div>
            </div>
        </div>

        <!-- Active Watchroom Screen -->
        <div id="room-view" class="hidden flex flex-col h-full w-full justify-between gap-2 overflow-hidden">

            <!-- Video Frame Container -->
            <div id="player-wrapper" class="relative bg-black rounded-xl overflow-hidden aspect-video w-full shadow-2xl border border-slate-800 flex items-center justify-center shrink-0">
                <video id="shared-video" controls class="w-full h-full object-contain hidden"></video>
                <div id="youtube-player" class="w-full h-full hidden"></div>
                <iframe id="generic-iframe" class="w-full h-full hidden border-0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                
                <!-- Small Floating Emojis Overlay -->
                <div id="emoji-overlay" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>

                <div id="video-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 space-y-1 bg-slate-900/90 z-10 p-4 text-center">
                    <span class="text-3xl">🍿</span>
                    <p class="text-xs font-medium">Paste YouTube, Vimeo, Facebook or Video link below</p>
                </div>
            </div>

            <!-- Clean Icon-Only Emoji Bar Directly Under Video -->
            <div class="flex justify-center bg-slate-900/80 border border-slate-800/80 p-1 rounded-xl shadow shrink-0">
                <div class="flex items-center justify-between max-w-sm w-full px-2">
                    <button onclick="sendEmoji('🍿')" class="hover:bg-slate-800 p-1.5 rounded-lg text-xl transition transform active:scale-95">🍿</button>
                    <button onclick="sendEmoji('🔥')" class="hover:bg-slate-800 p-1.5 rounded-lg text-xl transition transform active:scale-95">🔥</button>
                    <button onclick="sendEmoji('❤️')" class="hover:bg-slate-800 p-1.5 rounded-lg text-xl transition transform active:scale-95">❤️</button>
                    <button onclick="sendEmoji('😢')" class="hover:bg-slate-800 p-1.5 rounded-lg text-xl transition transform active:scale-95">😢</button>
                    <button onclick="sendEmoji('👻')" class="hover:bg-slate-800 p-1.5 rounded-lg text-xl transition transform active:scale-95">👻</button>
                    <button onclick="sendEmoji('🚀')" class="hover:bg-slate-800 p-1.5 rounded-lg text-xl transition transform active:scale-95">🚀</button>
                    <button onclick="sendEmoji('👏')" class="hover:bg-slate-800 p-1.5 rounded-lg text-xl transition transform active:scale-95">👏</button>
                </div>
            </div>

            <!-- Bottom Video Input Bar with Icon Button -->
            <div class="flex gap-2 bg-slate-900 p-2 rounded-xl border border-slate-800 shadow shrink-0">
                <input type="text" id="media-url-input" placeholder="Paste link (YouTube, Facebook, Vimeo, MP4)..." class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-indigo-500">
                <button onclick="changeMediaSource()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-1.5 rounded-lg text-sm font-medium transition shrink-0" title="Load Video">▶</button>
            </div>

            <!-- Bottom Status Tray: Viewers List Popover & Played History -->
            <div class="flex items-center justify-between gap-2 bg-slate-900/90 p-2 rounded-xl border border-slate-800 text-xs shrink-0">
                
                <!-- Viewers Popover Toggle -->
                <div id="users-pill" class="relative">
                    <button onclick="toggleUserPopup()" class="flex items-center gap-1.5 bg-slate-950 border border-slate-800 hover:bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg text-xs transition">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                        <strong id="peer-count" class="text-indigo-400">1</strong>
                        <span class="text-[9px] text-slate-500">▲</span>
                    </button>

                    <!-- Popup Viewers Window -->
                    <div id="users-popup" class="hidden absolute left-0 bottom-10 w-48 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl p-2.5 z-50">
                        <div class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5 border-b border-slate-800 pb-1">Viewers</div>
                        <div id="participants-list" class="flex flex-col gap-1 max-h-32 overflow-y-auto"></div>
                    </div>
                </div>

                <!-- Sleek Played History Tray -->
                <div class="flex items-center gap-1.5 overflow-x-auto max-w-[200px] sm:max-w-xs">
                    <div id="history-container" class="flex items-center gap-1 overflow-x-auto text-[10px]">
                        <span class="text-slate-600 italic">No history</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Client Script Logic -->
    <script>
        let peer = null;
        let connections = [];
        let isHost = false;
        let myId = '';
        let myUsername = 'Viewer_' + Math.floor(Math.random() * 1000);
        let participants = [];
        let roomPassword = '';
        let playedHistory = [];
        
        const videoElement = document.getElementById('shared-video');
        const genericIframe = document.getElementById('generic-iframe');
        let ytPlayer = null;
        let currentMode = null;
        let syncLock = false;

        window.addEventListener('load', () => {
            const savedName = localStorage.getItem('syncparty_username');
            if (savedName) document.getElementById('username-input').value = savedName;
            const hash = window.location.hash.substring(1);
            if (hash) document.getElementById('join-room-id').value = hash;

            window.addEventListener('click', (e) => {
                const pill = document.getElementById('users-pill');
                const popup = document.getElementById('users-popup');
                if (pill && !pill.contains(e.target)) {
                    popup.classList.add('hidden');
                }
            });
        });

        function toggleUserPopup() {
            document.getElementById('users-popup').classList.toggle('hidden');
        }

        function onYouTubeIframeAPIReady() {}

        function parseVideoPlatform(url) {
            // YouTube detection
            const ytMatch = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
            if (ytMatch && ytMatch[2].length === 11) return { type: 'youtube', id: ytMatch[2] };

            // Vimeo detection
            const vimeoMatch = url.match(/(?:vimeo)\.com.*(?:videos\/|video\/|channels\/|channels\/\w+\/|)([\d]+)/);
            if (vimeoMatch && vimeoMatch[1]) return { type: 'vimeo', url: `https://player.vimeo.com/video/${vimeoMatch[1]}?autoplay=1` };

            // Facebook Video detection
            if (url.includes('facebook.com') || url.includes('fb.watch')) {
                return { type: 'facebook', url: `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=0` };
            }

            // Default HTML5 Direct MP4/WebM
            return { type: 'html5', url: url };
        }

        function initPeer(customId = undefined) {
            return new Promise((resolve, reject) => {
                const nameVal = document.getElementById('username-input').value.trim();
                if (nameVal) {
                    myUsername = nameVal;
                    localStorage.setItem('syncparty_username', myUsername);
                }

                peer = new Peer(customId, {
                    config: {
                        'iceServers': [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' }
                        ]
                    },
                    debug: 1
                });

                peer.on('open', (id) => {
                    myId = id;
                    updateConnectionStatusDot(true);
                    resolve(id);
                });

                peer.on('error', (err) => {
                    updateConnectionStatusDot(false);
                    reject(err);
                });

                peer.on('connection', (conn) => { setupConnection(conn); });
            });
        }

        function updateConnectionStatusDot(isOnline) {
            const dot = document.getElementById('connection-status-dot');
            if (isOnline) {
                dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500/50";
                dot.title = "Connected";
            } else {
                dot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
                dot.title = "Offline";
            }
        }

        async function createRoom() {
            const customKey = document.getElementById('custom-room-input').value.trim().toUpperCase();
            roomPassword = document.getElementById('create-password-input').value.trim();
            const roomId = customKey || Math.random().toString(36).substring(2, 8).toUpperCase();

            try {
                await initPeer(roomId);
                isHost = true;
                participants = [{ id: myId, name: myUsername, host: true }];
                enterRoomUI(roomId);
            } catch (e) { console.error(e); }
        }

        async function joinRoom() {
            const roomId = document.getElementById('join-room-id').value.trim().toUpperCase();
            if (!roomId) return alert('Please enter room code.');
            try {
                await initPeer();
                isHost = false;
                participants = [{ id: myId, name: myUsername, host: false }];
                const conn = peer.connect(roomId, { metadata: { username: myUsername } });
                setupConnection(conn);
                enterRoomUI(roomId);
            } catch (e) { console.error(e); }
        }

        function enterRoomUI(roomId) {
            document.getElementById('lobby-card').classList.add('hidden');
            document.getElementById('room-view').classList.remove('hidden');
            document.getElementById('room-badge').classList.remove('hidden');
            document.getElementById('current-room-id').innerText = roomId;
            window.location.hash = roomId;
            updateParticipantsUI();
        }

        function setupConnection(conn) {
            connections.push(conn);

            conn.on('open', () => {
                if (!isHost) {
                    const passInput = roomPassword || prompt("Enter password (if any):") || "";
                    conn.send({ type: 'JOIN', username: myUsername, password: passInput });
                }
            });

            conn.on('data', (data) => { handleIncomingData(data, conn); });

            conn.on('close', () => {
                connections = connections.filter(c => c !== conn);
                participants = participants.filter(p => p.id !== conn.peer);
                updateParticipantsUI();
                if (isHost) broadcast({ type: 'PARTICIPANTS', list: participants });
            });
        }

        function broadcast(data, excludeConn = null) {
            if (isHost) {
                connections.forEach(conn => { if (conn !== excludeConn) conn.send(data); });
            }
        }

        function handleIncomingData(data, conn) {
            switch (data.type) {
                case 'JOIN':
                    if (isHost) {
                        if (roomPassword && data.password !== roomPassword) {
                            conn.send({ type: 'AUTH_FAILED' });
                            conn.close();
                            return;
                        }
                        if (!participants.some(p => p.id === conn.peer)) {
                            participants.push({ id: conn.peer, name: data.username, host: false });
                        }
                        broadcast({ type: 'PARTICIPANTS', list: participants });
                        updateParticipantsUI();
                    }
                    break;
                case 'AUTH_FAILED':
                    alert('Wrong password!');
                    window.location.reload();
                    break;
                case 'PARTICIPANTS':
                    participants = data.list;
                    updateParticipantsUI();
                    break;
                case 'EMOJI':
                    spawnFloatingEmoji(data.emoji);
                    if (isHost) broadcast(data, conn);
                    break;
                case 'MEDIA_CHANGE':
                    loadMediaSource(data.url, false);
                    if (isHost) broadcast(data, conn);
                    break;
                case 'VIDEO_ACTION':
                    syncLock = true;
                    executeVideoAction(data.action, data.time);
                    setTimeout(() => { syncLock = false; }, 400);
                    if (isHost) broadcast(data, conn);
                    break;
            }
        }

        function updateParticipantsUI() {
            document.getElementById('peer-count').innerText = participants.length;
            const container = document.getElementById('participants-list');
            container.innerHTML = participants.map(p => `
                <div class="flex items-center justify-between text-[11px] text-slate-300 bg-slate-950 px-2 py-1 rounded border border-slate-800">
                    <span class="truncate">🟢 ${escapeHtml(p.name)}</span>
                    <span>${p.host ? '👑' : ''}</span>
                </div>
            `).join('');
        }

        // --- Small Floating Emoji Reactions ---
        function sendEmoji(emoji) {
            spawnFloatingEmoji(emoji);
            const payload = { type: 'EMOJI', emoji: emoji };
            if (isHost) broadcast(payload);
            else if (connections.length > 0) connections[0].send(payload);
        }

        function spawnFloatingEmoji(emoji) {
            const overlay = document.getElementById('emoji-overlay');
            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.innerText = emoji;
            const randomX = Math.random() * 75 + 12; 
            el.style.left = `${randomX}%`;
            overlay.appendChild(el);
            setTimeout(() => { el.remove(); }, 2800);
        }

        // --- Multi-Platform Media Loader ---
        function changeMediaSource() {
            const url = document.getElementById('media-url-input').value.trim();
            if (!url) return;
            loadMediaSource(url, true);
        }

        function loadMediaSource(url, sendToOthers) {
            document.getElementById('video-placeholder').classList.add('hidden');
            const parsed = parseVideoPlatform(url);

            if (parsed.type === 'youtube') {
                currentMode = 'youtube';
                videoElement.classList.add('hidden');
                genericIframe.classList.add('hidden');
                videoElement.pause();
                document.getElementById('youtube-player').classList.remove('hidden');

                if (!ytPlayer) {
                    ytPlayer = new YT.Player('youtube-player', {
                        height: '100%',
                        width: '100%',
                        videoId: parsed.id,
                        playerVars: { 'autoplay': 1, 'controls': 1 },
                        events: { 'onStateChange': onYTStateChange }
                    });
                } else {
                    ytPlayer.loadVideoById(parsed.id);
                }
            } else if (parsed.type === 'vimeo' || parsed.type === 'facebook') {
                currentMode = 'iframe';
                videoElement.classList.add('hidden');
                document.getElementById('youtube-player').classList.add('hidden');
                if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
                
                genericIframe.src = parsed.url;
                genericIframe.classList.remove('hidden');
            } else {
                currentMode = 'html5';
                document.getElementById('youtube-player').classList.add('hidden');
                genericIframe.classList.add('hidden');
                if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
                
                videoElement.classList.remove('hidden');
                videoElement.src = url;
                videoElement.load();
            }

            addToPlayedHistory(url);

            if (sendToOthers) {
                const payload = { type: 'MEDIA_CHANGE', url: url };
                if (isHost) broadcast(payload);
                else if (connections.length > 0) connections[0].send(payload);
            }
        }

        function addToPlayedHistory(url) {
            if (!playedHistory.includes(url)) {
                playedHistory.unshift(url);
                if (playedHistory.length > 4) playedHistory.pop();
                renderHistoryUI();
            }
        }

        function renderHistoryUI() {
            const container = document.getElementById('history-container');
            container.innerHTML = playedHistory.map((url, idx) => `
                <button onclick="loadMediaSource('${escapeHtml(url)}', true)" class="bg-slate-950 border border-slate-800 text-indigo-400 px-2 py-0.5 rounded truncate max-w-[80px] text-[10px] hover:bg-slate-800 transition shrink-0" title="${escapeHtml(url)}">
                    Media ${playedHistory.length - idx}
                </button>
            `).join('');
        }

        videoElement.addEventListener('play', () => {
            if (syncLock || currentMode !== 'html5') return;
            sendVideoAction('play', videoElement.currentTime);
        });
        videoElement.addEventListener('pause', () => {
            if (syncLock || currentMode !== 'html5') return;
            sendVideoAction('pause', videoElement.currentTime);
        });
        videoElement.addEventListener('seeked', () => {
            if (syncLock || currentMode !== 'html5') return;
            sendVideoAction('seek', videoElement.currentTime);
        });

        function onYTStateChange(event) {
            if (syncLock || currentMode !== 'youtube') return;
            const time = ytPlayer.getCurrentTime();
            if (event.data === YT.PlayerState.PLAYING) sendVideoAction('play', time);
            else if (event.data === YT.PlayerState.PAUSED) sendVideoAction('pause', time);
        }

        function executeVideoAction(action, time) {
            if (currentMode === 'html5') {
                if (action === 'play') { videoElement.currentTime = time; videoElement.play().catch(() => {}); }
                else if (action === 'pause') { videoElement.currentTime = time; videoElement.pause(); }
                else if (action === 'seek') { videoElement.currentTime = time; }
            } else if (currentMode === 'youtube' && ytPlayer && ytPlayer.seekTo) {
                const diff = Math.abs(ytPlayer.getCurrentTime() - time);
                if (diff > 1.5) ytPlayer.seekTo(time, true);
                if (action === 'play') ytPlayer.playVideo();
                else if (action === 'pause') ytPlayer.pauseVideo();
            }
        }

        function sendVideoAction(action, time) {
            const payload = { type: 'VIDEO_ACTION', action: action, time: time };
            if (isHost) broadcast(payload);
            else if (connections.length > 0) connections[0].send(payload);
        }

        function copyHeaderRoomLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('Party link copied!');
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
